<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title"><title id="title">UART example timing diagram: idle, start, eight data bits, stop</title><g font-family="Arial,sans-serif" fill="#203a30"><text x="36" y="48" font-size="15">UART / SERIAL COMMUNICATION</text><text x="36" y="85" font-size="26">One byte. Bit by bit.</text><text x="36" y="270" font-size="14">Example frame · 8 data bits · no parity · 1 stop bit</text></g><path d="M36 135h48v65h44v-65h44v65h44v-65h44v65h88v-65h44v65h44v-65h126" fill="none" stroke="#246b54" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="13" fill="#53685d"><text x="38" y="228">Idle</text><text x="86" y="228">Start</text><text x="133" y="228">D0</text><text x="177" y="228">D1</text><text x="221" y="228">D2</text><text x="265" y="228">D3</text><text x="309" y="228">D4</text><text x="353" y="228">D5</text><text x="397" y="228">D6</text><text x="441" y="228">D7</text><text x="493" y="228">Stop</text></g></svg>